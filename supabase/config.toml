project_id = "kithwork"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
enable_signup = false
jwt_expiry = 1800

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "5MiB"

[functions.send-email]
verify_jwt = true

[functions.process-jobs]
verify_jwt = false

[functions.collaborator-admin]
verify_jwt = true

[functions.account-sessions]
verify_jwt = true
